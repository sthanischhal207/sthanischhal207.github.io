<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nischhal Shrestha</title>
    <meta name="description" content="Get in touch with Nischhal Shrestha.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">NS</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="experience.html">Experience</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </div>
    </nav>

    <main class="contact-page">
        <h1 class="page-title reveal">Get In Touch</h1>

        <div class="contact-container">
            
            <!-- Left Side: Contact Form -->
            <div class="contact-left reveal" style="--delay: 0.1s">
                <form class="contact-form" id="contactForm" novalidate>
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="johndoe@example.com">
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="Project Inquiry">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Hello, I'd like to talk about..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary form-submit-btn">Send Message</button>
                </form>
            </div>

            <!-- Right Side: Contact Info -->
            <div class="contact-right reveal" style="--delay: 0.2s">
                <div class="contact-info-card">
                    <div class="info-item">
                        <div class="info-icon"><i data-lucide="mail"></i></div>
                        <div class="info-text">
                            <h4>Email</h4>
                            <p>sthanischhal207@gmail.com</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon"><i data-lucide="phone"></i></div>
                        <div class="info-text">
                            <h4>Phone</h4>
                            <p>+977 9847690579</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon"><i data-lucide="map-pin"></i></div>
                        <div class="info-text">
                            <h4>Location</h4>
                            <p>Chandragiri-12, Kathmandu, Nepal</p>
                        </div>
                    </div>
                </div>

                <div class="social-grid mt-4">
                    <a href="https://www.linkedin.com/in/nischhal-shrestha-346537315/" target="_blank" class="social-btn" aria-label="LinkedIn">
                        <img src=".image/app_icons/linkedin.png" alt="LinkedIn" class="app-icon">
                    </a>
                    <a href="https://www.instagram.com/stha_nischhal207/" target="_blank" class="social-btn" aria-label="Instagram">
                        <img src=".image/app_icons/instagram.png" alt="Instagram" class="app-icon">
                    </a>
                    <a href="https://github.com/sthanischhal207" target="_blank" class="social-btn" aria-label="GitHub">
                        <img src=".image/app_icons/github.png" alt="GitHub" class="app-icon">
                    </a>
                    <a href="https://www.facebook.com/nischhal.shrestha.2025" target="_blank" class="social-btn" aria-label="Facebook">
                        <img src=".image/app_icons/facebook.png" alt="Facebook" class="app-icon">
                    </a>
                </div>
            </div>

        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 Nischhal Shrestha. Vibe coded.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
